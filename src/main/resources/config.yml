# Default settings for timed runs. Invalid numeric values are clamped safely at startup.
prefix: "&8[&cMATARIF Parkour&8] &7"

settings:
  default-fail-y: 60.0
  actionbar-enabled: true
  actionbar-period-ticks: 2
  particles-enabled: true
  particle-period-ticks: 10
  particle-type: END_ROD
  particle-count: 3
  titles-enabled: true
  title-fade-in-ticks: 5
  title-stay-ticks: 25
  title-fade-out-ticks: 8
  feedback-cooldown-ms: 900
  recovery-notice-cooldown-ms: 1500
  start-trigger-cooldown-ms: 1000
  recovery-search-up-blocks: 2

# Water is allowed by default for courses that include it. Lava returns the player to their
# latest safe pad. Each liquid action may be allow, recover, or invalidate.
rules:
  water-action: allow
  lava-action: recover
  teleports-invalidate-run: true
  flight-invalidates-run: true
  gliding-invalidates-run: true
  ender-pearls-invalidate-run: true

actionbar: "&e{time} &8| &f{course}"

messages:
  help: "&e/parkour create <name> &7- Create a course\n&e/parkour setstart <name> &7- Set its start pad\n&e/parkour setfinish <name> &7- Set its finish pad\n&e/parkour addcheckpoint <name> <number> &7- Add the next checkpoint\n&e/parkour setfaily <name> <y> &7- Set its fall boundary\n&e/parkour leaderboard <name> &7- Show the top three"
  player-only: "&cThis command requires a player standing at the pad to configure it."
  no-permission: "&cYou do not have permission to do that."
  leaderboard-no-permission: "&cYou do not have permission to view leaderboards."
  unknown-subcommand: "&cUnknown subcommand. Use /parkour for help."
  usage: "&cUsage: /parkour <create|setstart|setfinish|addcheckpoint|setfaily|leaderboard>"
  course-created: "&aCourse '{course}' created."
  course-exists: "&cA course named '{course}' already exists."
  course-not-found: "&cCourse '{course}' does not exist."
  invalid-course-name: "&cUse 1-32 letters, numbers, underscores, or hyphens for a course name."
  start-set: "&aStart pad saved for '{course}'."
  finish-set: "&aFinish pad saved for '{course}'."
  checkpoint-added: "&aCheckpoint {number} saved for '{course}'."
  invalid-checkpoint: "&cAdd checkpoints in order. The next checkpoint number is {expected}."
  invalid-pad: "&cStand in a clear block space with a solid block beneath you before saving a pad."
  duplicate-pad: "&cThis pad overlaps another pad in the course. Choose a different block space."
  different-world: "&cAll pads in a course must be in the same world."
  start-already-used: "&cAnother course already uses this start pad."
  course-incomplete: "&c'{course}' is not ready. Configure its start, finish, and checkpoints in one loaded world."
  invalid-fail-y: "&cThe failure Y-level must be finite, inside this world's height, and below every configured pad."
  fail-y-set: "&aFailure Y-level set to {y} for '{course}'."
  invalid-number: "&cEnter a valid finite number."
  run-started: "&aRun started: &f{course}"
  already-running: "&cYou are already running '{course}'. Finish or invalidate that run before starting another."
  cannot-start-while-flying: "&cDisable flying and gliding before starting a course."
  start-cooldown: "&cWait a moment before starting another run."
  checkpoint-reached: "&bCheckpoint {number} reached!"
  checkpoint-unavailable: "&cThis checkpoint is no longer safe; fix the course before continuing."
  checkpoint-order: "&cTouch checkpoint {expected} first."
  checkpoints-required: "&cTouch every checkpoint before finishing. Next: {expected}."
  recovery: "&7Returning to your latest checkpoint after {reason}. Your timer continues."
  recovery-failed: "&cThis run ended because its checkpoint is no longer safe."
  run-invalidated: "&cRun invalidated: {reason}"
  run-finished: "&aFinished {course} in &f{time}&a."
  new-record: "&6&lPERSONAL BEST! &e{time}"
  previous-record: "&7Your personal best remains {time}."
  no-records: "&7No completed runs have been recorded for '{course}' yet."
  leaderboard-title: "&6&l{course} &7- Top 3"
  leaderboard-line: "&e#{rank} &f{player} &7- &b{time}"
  leaderboard-no-course: "&cNo course named '{course}' exists."
  command-error: "&cThat command could not be completed. Check the course name and arguments."

titles:
  start: { title: "&aGO!", subtitle: "&f{course}" }
  checkpoint: { title: "&bCheckpoint {number}", subtitle: "&7Keep going!" }
  finish: { title: "&6Course complete!", subtitle: "&f{time}" }
  record: { title: "&eNew personal best!", subtitle: "&f{time}" }
  invalid: { title: "&cRun invalidated", subtitle: "&7{reason}" }

sounds:
  command-success: { enabled: true, type: "minecraft:entity.experience_orb.pickup", volume: 0.8, pitch: 1.2 }
  command-error: { enabled: true, type: "minecraft:entity.villager.no", volume: 0.8, pitch: 0.9 }
  start: { enabled: true, type: "minecraft:block.note_block.pling", volume: 0.8, pitch: 1.5 }
  checkpoint: { enabled: true, type: "minecraft:entity.experience_orb.pickup", volume: 0.8, pitch: 1.2 }
  recovery: { enabled: true, type: "minecraft:block.amethyst_block.chime", volume: 0.6, pitch: 0.8 }
  finish: { enabled: true, type: "minecraft:ui.toast.challenge_complete", volume: 0.9, pitch: 1.0 }
  record: { enabled: true, type: "minecraft:entity.player.levelup", volume: 0.8, pitch: 1.2 }
  invalid: { enabled: true, type: "minecraft:entity.villager.no", volume: 0.8, pitch: 0.8 }
